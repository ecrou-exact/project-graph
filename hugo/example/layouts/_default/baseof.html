<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
  <style>
    :root { color-scheme: light dark; --accent: #3b63f3; }
    body { margin: 0; font: 17px/1.6 system-ui, "Segoe UI", sans-serif; }
    header, main, footer { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
    header { display: flex; gap: 1.5rem; align-items: baseline; padding-top: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
    header a { color: inherit; text-decoration: none; }
    header strong { font-size: 1.1rem; }
    a { color: var(--accent); }
    main { padding-top: 1.5rem; padding-bottom: 3rem; }
    main > article { max-width: 46rem; }
    footer { padding-bottom: 2rem; font-size: 0.85rem; opacity: 0.7; }
    code { font-size: 0.9em; }
  </style>
</head>
<body>
  <header>
    <a href="{{ "/" | relURL }}"><strong>{{ site.Title }}</strong></a>
    <a href="{{ "/projects/" | relURL }}">Projects</a>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>Built with Hugo and the <a href="https://github.com/ecrou-exact/project-graph/tree/main/hugo">Pivograph component</a>.</footer>
</body>
</html>
