# Weekly: install the latest Pivotick, run the tests and the build, and open a
# pull request if the version changed.
name: Update Pivotick

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: bump
        run: |
          before=$(node -p "require('pivotick/package.json').version")
          npm install pivotick@latest
          after=$(node -p "require('pivotick/package.json').version")
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
      - if: steps.bump.outputs.before != steps.bump.outputs.after
        run: npm test && npm run build
      - if: steps.bump.outputs.before != steps.bump.outputs.after
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/pivotick
          commit-message: 'Update Pivotick to ${{ steps.bump.outputs.after }}'
          title: 'Update Pivotick ${{ steps.bump.outputs.before }} → ${{ steps.bump.outputs.after }}'
          body: 'Automated update. Tests and build passed with the new version.'
